<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar Hiragana & Katakana</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf3f6;--g1:#ffd6e3;--g2:#cfe0ff;--g3:#ffe9c7;--surface:rgba(255,255,255,.85);--ink:#16243b;--mute:#5d6b82;--line:#d9d2e0;--ind:#1f3a6e;--pink:#d6336c;--ok:#1f8a5b;--bad:#c92a2a;--dot:rgba(31,58,110,.09);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--g1:#3a1d3e;--g2:#14284f;--g3:#2f2416;--surface:rgba(24,34,58,.85);--ink:#e8edf7;--mute:#9aa8c2;--line:#33415f;--ind:#8fb0ff;--pink:#ff7ba5;--ok:#4cc58d;--bad:#ff7b7b;--dot:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--g1:#3a1d3e;--g2:#14284f;--g3:#2f2416;--surface:rgba(24,34,58,.85);--ink:#e8edf7;--mute:#9aa8c2;--line:#33415f;--ind:#8fb0ff;--pink:#ff7ba5;--ok:#4cc58d;--bad:#ff7b7b;--dot:rgba(255,255,255,.07);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh;
background:radial-gradient(circle at 12% 8%,var(--g1),transparent 42%),radial-gradient(circle at 90% 25%,var(--g2),transparent 45%),radial-gradient(circle at 40% 100%,var(--g3),transparent 50%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:24px 24px;pointer-events:none}
.sun{position:fixed;top:-90px;right:-90px;width:300px;height:300px;border-radius:50%;background:var(--pink);opacity:.14;pointer-events:none;animation:breathe 7s ease-in-out infinite}
#petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.petal{position:absolute;top:-30px;background:linear-gradient(135deg,#ffc2d6,#ff8fb3);border-radius:150% 0 150% 0;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes bump{50%{transform:scale(1.12)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:18px 14px 70px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:0;font-weight:900}
h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--mute)}
.logo{display:inline-block;animation:bump 3s ease-in-out infinite}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;backdrop-filter:blur(6px)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.prog{height:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fb3,var(--pink));border-radius:99px;transition:width .6s}
.plabel{font-size:.85rem;color:var(--mute);margin-bottom:6px}
.tabs{display:flex;gap:6px;margin:10px 0 16px;overflow-x:auto;padding-bottom:4px}
.tab{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:700;white-space:nowrap;transition:transform .15s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected=true]{background:var(--ind);color:var(--bg);border-color:var(--ind)}
.tab span{margin-right:4px}
#view{animation:fade .35s}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;justify-content:center}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:700}
.chip[aria-pressed=true]{background:var(--ind);color:var(--bg);border-color:var(--ind)}
h2{font-size:1.1rem;margin:20px 0 10px;color:var(--ind)}
.scroll{overflow-x:auto}
.kt{width:100%;border-collapse:collapse;table-layout:fixed;min-width:600px;background:var(--surface);border-radius:14px;border:1.5px solid var(--line);backdrop-filter:blur(6px)}
.kt th,.kt td{padding:0;text-align:center;border:1px solid var(--line)}
.kt thead th{background:color-mix(in srgb,var(--ind) 18%,transparent);padding:10px 4px;font-size:.9rem}
.kt tbody th{background:color-mix(in srgb,var(--ind) 12%,transparent);width:52px}
.kt tr.alt td{background:color-mix(in srgb,var(--ind) 6%,transparent)}
.kt .sep{border-left:2.5px solid var(--ink)}
.kc{width:100%;background:none;border:0;padding:8px 2px 6px;display:block;position:relative;transition:transform .15s,background .2s}
.kc:hover{background:color-mix(in srgb,var(--pink) 16%,transparent);transform:scale(1.12);z-index:2}
.kc .k{display:block;font-size:1.9rem;line-height:1.25;font-weight:700}
.kc .r{display:block;font-size:.85rem;color:var(--pink);font-weight:700}
.kc.done{background:color-mix(in srgb,var(--ok) 20%,transparent)}
.kc.done::after{content:"✓";position:absolute;top:1px;right:5px;font-size:.75rem;color:var(--ok)}
.hide .kc .r{visibility:hidden}
.hide .kc:hover .r,.hide .kc:focus-visible .r{visibility:visible}
.card,.quiz{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px;text-align:center;max-width:460px;margin:0 auto;backdrop-filter:blur(6px)}
.btn{background:var(--ind);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-weight:700;margin:4px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--bad);color:#fff}
dialog{border:0;border-radius:22px;background:var(--surface);color:var(--ink);padding:24px;width:min(340px,92vw);text-align:center;backdrop-filter:blur(10px);animation:pop .25s}
dialog::backdrop{background:rgba(10,15,30,.6)}
.big{font-size:6rem;line-height:1.15;font-weight:700}
.rom{font-size:1.8rem;color:var(--pink);font-weight:900}
.pair{display:flex;justify-content:center;gap:28px;font-size:2.3rem;margin:8px 0}
.pair small{display:block;font-size:.75rem;color:var(--mute)}
.flash{perspective:900px;cursor:pointer;height:230px;margin-bottom:12px}
.flash>div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:18px;backface-visibility:hidden;transition:transform .5s;border:2px solid var(--line);background:var(--surface)}
.flash{position:relative}
.flash .back{transform:rotateY(180deg);flex-direction:column}
.flash.flipped .front{transform:rotateY(180deg)}
.flash.flipped .back{transform:rotateY(0)}
.pad{position:relative;width:min(320px,100%);aspect-ratio:1;margin:0 auto 10px;background:var(--surface);border:2px dashed var(--line);border-radius:18px;overflow:hidden}
.pad::before,.pad::after{content:"";position:absolute;background:var(--line);opacity:.6}
.pad::before{left:50%;top:0;bottom:0;width:1px}.pad::after{top:50%;left:0;right:0;height:1px}
.guide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(14rem,60vw);color:var(--mute);opacity:.22;pointer-events:none}
.pad.noguide .guide{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
select{font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:6px}
table.n{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden}
.n th,.n td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.n th{color:var(--mute);font-size:.85rem}
.n tr[data-say]{cursor:pointer}.n tr[data-say]:hover{background:color-mix(in srgb,var(--pink) 12%,transparent)}
.n .num{font-size:1.4rem;font-weight:900;text-align:center}.n .j{font-size:1.5rem}.n .ro{color:var(--pink);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:none;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:1.3rem;font-weight:700;transition:transform .15s}
.opt:hover{transform:scale(1.04)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent);animation:bump .4s}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,transparent);animation:shake .4s}
.qk{font-size:5rem;font-weight:700;line-height:1.2;min-height:6rem}
.mute{color:var(--mute);font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ind);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:50;animation:pop .25s}
.conf{position:fixed;left:50%;top:50%;font-size:1.8rem;pointer-events:none;z-index:60;animation:fly 1s ease-out forwards}
h1,h2,.tab,.btn,.chip,.pill,.rom,.opt,.plabel{font-family:Montserrat,Poppins,system-ui,sans-serif}
[lang=ja]{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Noto Sans CJK JP",sans-serif}
select{max-width:100%;font-size:16px}
@media (max-width:640px){
.wrap{padding:12px 10px calc(92px + env(safe-area-inset-bottom,0px))}
h1 small{font-size:.75rem}
.pill{font-size:.78rem;padding:3px 9px}
.sun{width:200px;height:200px;top:-70px;right:-70px}
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);backdrop-filter:blur(12px);border-top:1.5px solid var(--line);z-index:40;justify-content:space-between;gap:2px;overflow:visible}
.tab{flex:1;min-width:0;padding:6px 2px;font-size:.62rem;border:0;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab span{font-size:1.3rem;margin:0}
.kt{min-width:0}
.kt thead th{padding:6px 0;font-size:.7rem}
.kt tbody th{width:28px;font-size:.75rem}
.kc{padding:5px 0 3px}.kc .k{font-size:1.15rem}.kc .r{font-size:.6rem}
.kc:hover{transform:none}
.kc.done::after{top:0;right:1px;font-size:.55rem}
.big{font-size:5rem}.qk{font-size:3.6rem;min-height:5rem}
.flash{height:190px}
.card,.quiz{padding:14px}
.btn{padding:10px 12px;font-size:.88rem}
.opt{font-size:1.1rem;padding:11px 6px}
.n th,.n td{padding:7px 6px;font-size:.85rem}.n .j{font-size:1.1rem}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rates .btn{margin:0;padding:8px 2px}
.rb{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}
.rb small{font-weight:400;font-size:.68rem;opacity:.85}
.sc{display:flex;justify-content:center;gap:18px;font-weight:700;margin-bottom:10px}
details summary{cursor:pointer}details p{margin:8px 0}
.wm{text-align:center;color:var(--mute);font-family:Montserrat,Poppins,sans-serif;font-size:.8rem;letter-spacing:.04em;margin-top:34px;opacity:.85}
.wm b{color:var(--pink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#petals{display:none}}
</style>
</head>
<body>
<div class="sun"></div><div id="petals" aria-hidden="true"></div>
<div class="wrap">
<header>
 <h1><span class="logo">🌸</span> Belajar Kana<small>Hiragana, Katakana, dan angka Jepang</small></h1>
 <div class="stats"><span id="stats"></span><button class="pill" id="theme" aria-label="Ganti tema">🌓</button></div>
</header>
<div class="prog" role="progressbar" aria-label="Progres hafalan"><i id="pbar"></i></div>
<div class="plabel" id="plabel"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="view"></div>
<footer class="wm">🌸 Dibuat oleh <b>Hasanal Ridwan</b></footer>
</div>
<dialog id="dlg"></dialog>
<script>
var SETS={"Hiragana dasar":[
["Ø","あ a,い i,う u,え e,お o",""],["K","か ka,き ki,く ku,け ke,こ ko","きゃ kya,きゅ kyu,きょ kyo"],["S","さ sa,し shi,す su,せ se,そ so","しゃ sha,しゅ shu,しょ sho"],["T","た ta,ち chi,つ tsu,て te,と to","ちゃ cha,ちゅ chu,ちょ cho"],["N","な na,に ni,ぬ nu,ね ne,の no","にゃ nya,にゅ nyu,にょ nyo"],["H","は ha,ひ hi,ふ fu,へ he,ほ ho","ひゃ hya,ひゅ hyu,ひょ hyo"],["M","ま ma,み mi,む mu,め me,も mo","みゃ mya,みゅ myu,みょ myo"],["Y","や ya,,ゆ yu,,よ yo",""],["R","ら ra,り ri,る ru,れ re,ろ ro","りゃ rya,りゅ ryu,りょ ryo"],["W","わ wa,,,,を wo",""]],
"Dengan dakuten / handakuten":[
["G","が ga,ぎ gi,ぐ gu,げ ge,ご go","ぎゃ gya,ぎゅ gyu,ぎょ gyo"],["Z","ざ za,じ ji,ず zu,ぜ ze,ぞ zo","じゃ ja,じゅ ju,じょ jo"],["D","だ da,ぢ ji,づ zu,で de,ど do","ぢゃ ja,ぢゅ ju,ぢょ jo"],["B","ば ba,び bi,ぶ bu,べ be,ぼ bo","びゃ bya,びゅ byu,びょ byo"],["P","ぱ pa,ぴ pi,ぷ pu,ぺ pe,ぽ po","ぴゃ pya,ぴゅ pyu,ぴょ pyo"]]};
var NUM=[[0,"零 / ゼロ","れい / ぜろ","rei / zero","nol"],[1,"一","いち","ichi","satu"],[2,"二","に","ni","dua"],[3,"三","さん","san","tiga"],[4,"四","よん / し","yon / shi","empat"],[5,"五","ご","go","lima"],[6,"六","ろく","roku","enam"],[7,"七","なな / しち","nana / shichi","tujuh"],[8,"八","はち","hachi","delapan"],[9,"九","きゅう / く","kyuu / ku","sembilan"],[10,"十","じゅう","juu","sepuluh"],[11,"十一","じゅういち","juu ichi","sebelas"],[20,"二十","にじゅう","ni juu","dua puluh"],[50,"五十","ごじゅう","go juu","lima puluh"],[100,"百","ひゃく","hyaku","seratus"],[1000,"千","せん","sen","seribu"],[10000,"万 / 一万","まん / いちまん","man / ichi man","sepuluh ribu"]];
var kata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
var cells=(x,n)=>{var a=x?x.split(","):[];while(a.length<n)a.push("");return a};
var ALL=[{h:"ん",k:"ン",r:"n"}];
Object.keys(SETS).forEach(t=>SETS[t].forEach(r=>cells(r[1],5).concat(cells(r[2],3)).forEach(c=>{var p=c.split(" ");if(p.length==2)ALL.push({h:p[0],k:kata(p[0]),r:p[1]})})));
var POOL=ALL.filter(x=>x.h!="を");
var rom=(c,r,isH)=>c=="を"&&isH?"o":r;
var disp=(x,sc)=>sc=="kata"?x.k:x.h;
var rnd=a=>a[Math.floor(Math.random()*a.length)];
var S={tab:"hira",hide:false,dak:false,yoon:false,m:{},srs:{},nt:{d:0,n:0},nl:10,xp:0,days:0,last:"",weak:{}};
try{var d=JSON.parse(localStorage.getItem("kana1")||"{}");for(var k in d)S[k]=d[k]}catch(e){}
(function(){var t=new Date().toDateString();if(S.last!=t){S.days=S.last==new Date(Date.now()-864e5).toDateString()?S.days+1:1;S.last=t;save()}})();
function save(){try{localStorage.setItem("kana1",JSON.stringify({srs:S.srs,nt:S.nt,nl:S.nl,m:S.m,xp:S.xp,days:S.days,last:S.last,weak:S.weak}))}catch(e){}}
var $=id=>document.getElementById(id),view=$("view"),dlg=$("dlg");
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function toast(m){var o=$("toast");if(o)o.remove();var t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function burst(n){var e=["🌸","✨","⭐","🎉","🎌"];for(var i=0;i<(n||12);i++){var s=document.createElement("span");s.className="conf";s.textContent=rnd(e);s.style.setProperty("--x",(Math.random()*500-250)+"px");s.style.setProperty("--y",(Math.random()*-350-50)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function addXP(n){var l=Math.floor(S.xp/100);S.xp+=n;save();head();if(Math.floor(S.xp/100)>l){toast("Naik ke level "+(l+2)+"! 🎊");burst(20)}}
function head(){var done=Object.keys(S.m).length,tot=ALL.length*2;
 $("stats").innerHTML='<span class="pill">⭐ Lv '+(Math.floor(S.xp/100)+1)+'</span> <span class="pill">✨ '+S.xp+' XP</span> <span class="pill">🔥 '+S.days+' hari</span>';
 $("pbar").style.width=(done/tot*100)+"%";$("plabel").textContent="Hafal "+done+" dari "+tot+" huruf (Hiragana + Katakana)"}
var T=[["hira","🌸","Hiragana"],["kata","🎴","Katakana"],["num","🔢","Angka"],["fc","🃏","Kartu"],["wr","✍️","Tulis"],["quiz","🎯","Kuis"]];
$("tabs").innerHTML=T.map(t=>'<button class="tab" role="tab" data-t="'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join("");
var mk=(c,isH)=>(isH?"h":"k")+c;
function table(title,rows,isH){
 var h='<h2>'+title.replace("Hiragana",isH?"Hiragana":"Katakana")+'</h2><div class="scroll"><table class="kt"><thead><tr><th></th>';
 ["a","i","u","e","o","ya","yu","yo"].slice(0,S.yoon?8:5).forEach((v,i)=>h+='<th class="'+(i==5?'sep':'')+'">'+v+'</th>');
 h+='</tr></thead><tbody>';
 rows.forEach((r,i)=>{h+='<tr class="'+(i%2?'alt':'')+'"><th scope="row">'+r[0]+'</th>';
  cells(r[1],5).concat(S.yoon?cells(r[2],3):[]).forEach((c,j)=>{var p=c.split(" "),cl=j==5?' class="sep"':'';
   h+=p.length!=2?'<td'+cl+'></td>':'<td'+cl+'>'+kc(p[0],rom(p[0],p[1],isH),isH)+'</td>'});h+='</tr>'});
 return h+'</tbody></table></div>'}
function kc(c,r,isH){return '<button class="kc'+(S.m[mk(c,isH)]?' done':'')+'" data-c="'+c+'" data-r="'+r+'"><span class="k" lang="ja">'+(isH?c:kata(c))+'</span><span class="r">'+r+'</span></button>'}
function rTable(){var isH=S.tab=="hira";
 var h='<div class="bar"><span class="mute">Klik huruf untuk detail dan suara. Hijau = sudah hafal.</span><button class="chip" id="tdak" aria-pressed="'+S.dak+'">'+(S.dak?'➖ Sembunyikan':'➕ Tampilkan')+' dakuten</button><button class="chip" id="tyoon" aria-pressed="'+S.yoon+'">'+(S.yoon?'➖ Sembunyikan':'➕ Tampilkan')+' yōon</button><button class="chip" id="hide" aria-pressed="'+S.hide+'">🙈 Sembunyikan romaji</button></div><div class="'+(S.hide?'hide':'')+'">';
 Object.keys(SETS).forEach((t,i)=>{if(i==0)h+=table(t,SETS[t],isH);else if(S.dak)h+='<p class="mute">Dakuten (゛) dan handakuten (゜) mengubah bunyi huruf dasar, misalnya か ka menjadi が ga, dan は ha menjadi ぱ pa.</p>'+table(t,SETS[t],isH)});if(S.yoon)h+='<p class="mute">Yōon adalah gabungan huruf i-kolom dengan や ゆ よ kecil, misalnya き + ゃ = きゃ kya.</p>';
 view.innerHTML=h+'<h2>Tambahan</h2><div style="width:100px" class="kt">'+kc("ん","n",isH)+'</div></div>'}
function rNum(){var h='<div class="bar"><button class="btn" id="sayall">🔊 Dengarkan 1 sampai 10</button><span class="mute">Klik baris untuk mendengar</span></div><div class="scroll"><table class="n"><thead><tr><th>Angka</th><th>Kanji</th><th>Hiragana</th><th>Romaji</th><th>Indonesia</th></tr></thead><tbody>';
 NUM.forEach(n=>h+='<tr data-say="'+n[2].split(" / ")[0]+'"><td class="num">'+n[0]+'</td><td class="j" lang="ja">'+n[1]+'</td><td class="j" lang="ja">'+n[2]+'</td><td class="ro">'+n[3]+'</td><td>'+n[4]+'</td></tr>');
 view.innerHTML=h+'</tbody></table></div>'}
var fc={sc:"hira",cur:undefined,flip:false,step:0};
var today=()=>Math.floor(Date.now()/864e5);
function pairs(){var o=[],sc=fc.sc=="mix"?["hira","kata"]:[fc.sc];ALL.forEach(x=>sc.forEach(c=>o.push({c:x,sc:c,k:mk(x.h,c=="hira")})));return o}
function sched(s,g){var n={i:s.i||0,e:s.e||2.5,r:s.r||0,l:s.l||0,d:today(),t:0};
 if(g==0){n.l++;n.e=Math.max(1.3,n.e-.2);n.i=0;n.r=0;n.t=fc.step+3}
 else{n.i=g==1?Math.max(1,Math.round((n.i||1)*1.2)):g==2?(n.r==0?1:n.r==1?3:Math.round(n.i*n.e)):(n.r==0?4:Math.round(Math.max(n.i,1)*n.e*1.3));
  if(g==1)n.e=Math.max(1.3,n.e-.15);if(g==3)n.e+=.15;n.r++;n.d=today()+n.i}
 return n}
var lab=(s,g)=>{if(g==0)return"segera";var i=sched(s||{},g).i;return i<30?i+" hari":Math.round(i/30)+" bln"};
function counts(){var t=today(),p=pairs(),due=0,nw=0;p.forEach(x=>{var s=S.srs[x.k];if(s){if(s.d<=t)due++}else nw++});
 var used=S.nt.d==t?S.nt.n:0;return{due:due,nw:Math.min(nw,Math.max(0,S.nl-used)),all:p.length}}
function nextFC(){var t=today(),p=pairs(),dl=p.filter(x=>S.srs[x.k]&&S.srs[x.k].d<=t),rd=dl.filter(x=>(S.srs[x.k].t||0)<=fc.step),cur=fc.cur,pick=null,used=S.nt.d==t?S.nt.n:0,nw=p.filter(x=>!S.srs[x.k]);
 if(rd.length){rd.sort(()=>Math.random()-.5);rd.sort((a,b)=>S.srs[a.k].d-S.srs[b.k].d);pick=rd.find(x=>!cur||x.k!=cur.k)||rd[0]}
 else if(nw.length&&used<S.nl)pick=rnd(nw);
 else if(dl.length){dl.sort(()=>Math.random()-.5);pick=dl.find(x=>!cur||x.k!=cur.k)||dl[0]}
 fc.cur=pick;fc.flip=false}
function rate4(){var s=S.srs[fc.cur.k];return '<div class="rates">'+[["0","Lagi","btn no"],["1","Sulit","btn alt"],["2","Bagus","btn"],["3","Mudah","btn ok"]].map(a=>'<button class="'+a[2]+' rb" data-fg="'+a[0]+'">'+a[1]+'<small>'+lab(s,+a[0])+'</small></button>').join("")+'</div>'}
function fshow(){if(!fc.cur||fc.flip)return;fc.flip=true;$("fl").classList.add("flipped");$("fa").innerHTML=rate4();say(fc.cur.c.h)}
function rate(g){var c=fc.cur;if(!c||!fc.flip)return;var s=S.srs[c.k],t=today();
 if(!s)S.nt=S.nt.d==t?{d:t,n:S.nt.n+1}:{d:t,n:1};
 var n=sched(s||{},g);S.srs[c.k]=n;fc.step++;
 if(g==0)delete S.m[c.k];else if(n.i>=7)S.m[c.k]=1;
 if(g>=2)addXP(g==3?5:3);else save();
 head();nextFC();render()}
function rFC(){if(fc.cur===undefined)nextFC();var c=fc.cur,n=counts();
 var h='<div class="bar">'+[["hira","Hiragana"],["kata","Katakana"],["mix","Campur"]].map(a=>'<button class="chip" data-fs="'+a[0]+'" aria-pressed="'+(fc.sc==a[0])+'">'+a[1]+'</button>').join("")+'</div><div class="card"><div class="sc"><span style="color:var(--ind)">Baru '+n.nw+'</span><span style="color:var(--bad)">Ulang '+n.due+'</span><span class="mute">Total '+n.all+'</span></div>';
 if(!c){var ds=pairs().map(x=>S.srs[x.k]).filter(Boolean).map(x=>x.d),dd=ds.length?Math.min.apply(null,ds)-today():0;
  h+='<div class="qk">🎉</div><p><b>Selesai untuk hari ini!</b></p><p class="mute">Kartu berikutnya jatuh tempo '+(dd<=0?'sebentar lagi':dd+' hari lagi')+'. Kembali besok supaya ingatan tetap kuat dan streak terjaga. Mau lanjut? Naikkan batas kartu baru di bawah.</p>'}
 else h+='<div class="flash'+(fc.flip?' flipped':'')+'" id="fl"><div class="front"><span class="big" lang="ja">'+disp(c.c,c.sc)+'</span></div><div class="back"><span class="rom" style="font-size:3rem">'+rom(c.c.h,c.c.r,c.sc=="hira")+'</span><span class="mute">'+(S.srs[c.k]?'Kartu ulangan':'Kartu baru')+'</span></div></div><div id="fa">'+(fc.flip?rate4():'<button class="btn" id="fshow">Tampilkan jawaban</button>')+'</div><div class="mute">Tebak romajinya dulu, baru tampilkan jawaban. Pintasan: Spasi, lalu 1 sampai 4.</div>';
 h+='</div><div class="bar" style="margin-top:12px"><label class="mute">Kartu baru per hari <select id="nl">'+[5,10,20,46].map(v=>'<option'+(S.nl==v?' selected':'')+'>'+v+'</option>').join("")+'</select></label></div><details class="mute card" style="margin-top:8px;text-align:left"><summary><b>Cara kerja metode Anki (spaced repetition)</b></summary><p>Huruf diulang tepat sebelum kamu lupa. Setelah menjawab, pilih seberapa mudah ingatannya:</p><p><b>Lagi</b>: lupa, kartu muncul lagi beberapa kartu kemudian. <b>Sulit</b>: ingat dengan susah payah, jeda naik sedikit. <b>Bagus</b>: ingat, jeda naik jelas (1 hari, 3 hari, lalu makin panjang). <b>Mudah</b>: langsung ingat, jeda naik paling jauh.</p><p>Huruf yang jedanya sudah 7 hari atau lebih otomatis dianggap hafal dan dihitung di bar progres. Belajar sedikit tiap hari lebih efektif daripada sekali banyak.</p></details>';
 view.innerHTML=h}
var wr={sc:"hira",c:ALL[0],guide:true};
function rWrite(){var c=wr.c;
 var h='<div class="bar">'+[["hira","Hiragana"],["kata","Katakana"]].map(a=>'<button class="chip" data-ws="'+a[0]+'" aria-pressed="'+(wr.sc==a[0])+'">'+a[1]+'</button>').join("")+'<select id="pick" aria-label="Pilih huruf">'+ALL.map(x=>'<option value="'+x.h+'"'+(x.h==c.h?' selected':'')+'>'+disp(x,wr.sc)+' '+rom(x.h,x.r,wr.sc=="hira")+'</option>').join("")+'</select></div>';
 h+='<div class="pad'+(wr.guide?'':' noguide')+'" id="pad"><div class="guide" lang="ja">'+disp(c,wr.sc)+'</div><canvas id="cv" width="320" height="320"></canvas></div><div class="bar"><span class="rom">'+rom(c.h,c.r,wr.sc=="hira")+'</span></div><div class="bar"><button class="btn" id="wsay">🔊 Dengar</button><button class="btn alt" id="wclr">🧽 Hapus</button><button class="btn alt" id="wg">👁️ Panduan</button><button class="btn alt" id="wrnd">🎲 Acak</button><button class="btn ok" id="wok">✅ Sudah bisa</button></div><p class="mute" style="text-align:center">Tulis dengan jari atau mouse mengikuti bentuk huruf. Mulai dari panduan, lalu coba tanpa panduan.</p>';
 view.innerHTML=h;var cv=$("cv"),x=cv.getContext("2d"),dr=false;
 x.lineWidth=11;x.lineCap=x.lineJoin="round";x.strokeStyle=getComputedStyle(document.body).getPropertyValue("--ink");
 var pt=e=>{var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]);x.stroke()};
 cv.onpointermove=e=>{if(!dr)return;var p=pt(e);x.lineTo(p[0],p[1]);x.stroke()};
 cv.onpointerup=cv.onpointercancel=()=>dr=false}
var q={mode:"k2r",s:0,n:0,c:0,b:0,cur:null,done:false};
function nextQ(){var wk=Object.keys(S.weak),c=wk.length&&Math.random()<.4?POOL.find(x=>x.h==rnd(wk)):null;c=c||rnd(POOL);
 var o=[c];while(o.length<4){var r=rnd(POOL);if(o.every(x=>x.r!=r.r))o.push(r)}
 o.sort(()=>Math.random()-.5);q.cur={c:c,sc:rnd(["hira","kata"]),o:o};q.done=false;if(q.mode=="snd")say(c.h)}
function rQuiz(){if(!q.cur)nextQ();var c=q.cur,m=q.mode;
 var h='<div class="bar">'+[["k2r","Kana ke romaji"],["r2k","Romaji ke kana"],["snd","🎧 Dengar ke kana"]].map(a=>'<button class="chip" data-m="'+a[0]+'" aria-pressed="'+(m==a[0])+'">'+a[1]+'</button>').join("")+'</div>';
 h+='<div class="quiz"><div class="mute" id="qs">Skor '+q.s+' / '+q.n+' · Kombo 🔥 '+q.c+' · Terbaik '+q.b+'</div><div class="qk" lang="ja">'+(m=="k2r"?disp(c.c,c.sc):m=="r2k"?'<span style="font-size:4rem">'+rom(c.c.h,c.c.r,true)+'</span>':'<button class="btn" id="qsay" style="font-size:2rem">🔊</button>')+'</div><div>'+(m=="k2r"?"Apa romajinya?":m=="r2k"?"Pilih huruf yang benar":"Pilih huruf yang kamu dengar")+'</div><div class="opts">';
 c.o.forEach(o=>h+='<button class="opt" lang="ja" data-o="'+o.h+'">'+(m=="k2r"?o.r:disp(o,c.sc))+'</button>');
 h+='</div><div id="qnx"></div>'+(Object.keys(S.weak).length?'<p class="mute">Huruf yang sering salah: '+Object.keys(S.weak).slice(0,8).join(" ")+' (akan lebih sering muncul)</p>':'')+'</div>';
 view.innerHTML=h}
function answer(t){if(q.done)return;q.done=true;q.n++;var c=q.cur,ok=t.dataset.o==c.c.h;
 if(ok){q.s++;q.c++;q.b=Math.max(q.b,q.c);delete S.weak[c.c.h];addXP(10+Math.min(q.c,10)*2);if(q.c%5==0){burst();toast("Kombo "+q.c+"! 🔥")}}
 else{q.c=0;S.weak[c.c.h]=1;save()}
 view.querySelectorAll(".opt").forEach(b=>{if(b.dataset.o==c.c.h)b.classList.add("ok");else if(b===t)b.classList.add("bad")});
 $("qs").textContent="Skor "+q.s+" / "+q.n+" · Kombo 🔥 "+q.c+" · Terbaik "+q.b+(ok?" · Benar!":" · Jawaban: "+c.c.r);
 if(ok)setTimeout(()=>{if(q.cur===c&&S.tab=="quiz"){nextQ();render()}},800);
 else $("qnx").innerHTML='<button class="btn" id="nx">Lanjut ➜</button>'}
function mark(c,isH,on){if(on)S.m[mk(c,isH)]=1;else delete S.m[mk(c,isH)];save();head()}
function detail(c,r){var isH=S.tab=="hira",on=!!S.m[mk(c,isH)];
 dlg.innerHTML='<div class="big" lang="ja">'+(isH?c:kata(c))+'</div><div class="rom">'+r+'</div><div class="pair"><div lang="ja">'+c+'<small>Hiragana</small></div><div lang="ja">'+kata(c)+'<small>Katakana</small></div></div><button class="btn" id="spk">🔊 Dengar</button><button class="btn alt" id="dwr">✍️ Latihan tulis</button><button class="btn '+(on?'alt':'ok')+'" id="dmk">'+(on?'↩️ Batal hafal':'✅ Tandai hafal')+'</button><button class="btn alt" id="cls">Tutup</button>';
 dlg.showModal();say(c);
 $("spk").onclick=()=>say(c);$("cls").onclick=()=>dlg.close();
 $("dwr").onclick=()=>{dlg.close();wr.sc=isH?"hira":"kata";wr.c=ALL.find(x=>x.h==c);S.tab="wr";render()};
 $("dmk").onclick=()=>{mark(c,isH,!on);if(!on){addXP(5);burst(8)}dlg.close();render()}}
var R={hira:rTable,kata:rTable,num:rNum,fc:rFC,wr:rWrite,quiz:rQuiz};
function render(){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.t==S.tab));R[S.tab]()}
function go(t){S.tab=t;view.style.animation="none";void view.offsetWidth;view.style.animation="";render()}
$("tabs").onclick=e=>{var b=e.target.closest(".tab");if(b)go(b.dataset.t)};
view.onclick=e=>{var t=e.target.closest("button,tr[data-say],.flash");if(!t)return;var d=t.dataset;
 if(d.c)detail(d.c,d.r);else if(t.id=="hide"){S.hide=!S.hide;render()}
 else if(t.id=="tdak"){S.dak=!S.dak;render()}else if(t.id=="tyoon"){S.yoon=!S.yoon;render()}
 else if(d.say)say(d.say);else if(t.id=="sayall")say("いち、に、さん、よん、ご、ろく、なな、はち、きゅう、じゅう");
 else if(t.id=="fl"||t.id=="fshow")fshow();
 else if(d.fg!==undefined)rate(+d.fg);
 else if(d.fs){fc.sc=d.fs;fc.cur=undefined;render()}
 else if(d.ws){wr.sc=d.ws;render()}
 else if(t.id=="wsay")say(wr.c.h);else if(t.id=="wclr")render();else if(t.id=="wg"){wr.guide=!wr.guide;$("pad").classList.toggle("noguide",!wr.guide)}
 else if(t.id=="wrnd"){wr.c=rnd(ALL);render()}
 else if(t.id=="wok"){mark(wr.c.h,wr.sc=="hira",true);addXP(5);burst(8);wr.c=rnd(ALL);render()}
 else if(d.m){q.mode=d.m;q.s=q.n=q.c=0;q.cur=null;render()}
 else if(t.id=="qsay")say(q.cur.c.h);else if(t.id=="nx"){nextQ();render()}
 else if(d.o)answer(t)};
view.onchange=e=>{if(e.target.id=="nl"){S.nl=+e.target.value;save();fc.cur=undefined;render()}if(e.target.id=="pick"){wr.c=ALL.find(x=>x.h==e.target.value);render()}};
document.addEventListener("keydown",e=>{if(S.tab!="fc"||dlg.open||!fc.cur||e.target.tagName=="SELECT")return;if((e.key==" "||e.key=="Enter")&&!fc.flip){e.preventDefault();fshow()}else if(fc.flip&&"1234".indexOf(e.key)>=0&&e.key)rate(+e.key-1)});
dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
$("theme").onclick=()=>{var r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dk?"light":"dark";render()};
for(var i=0;i<14;i++){var p=document.createElement("div"),s=8+Math.random()*10;p.className="petal";p.style.cssText="left:"+Math.random()*100+"%;width:"+s+"px;height:"+s+"px;animation-duration:"+(9+Math.random()*10)+"s;animation-delay:-"+Math.random()*15+"s;--dx:"+(Math.random()*160-80)+"px";$("petals").appendChild(p)}
head();render();
</script>
